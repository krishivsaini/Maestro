name: tests

# Every push and pull request runs the whole suite offline: stubbed models, plus the
# recorded runs in data/cassettes replayed through the current code. No API key, no
# quota, no network beyond installing dependencies.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install (exactly as locked)
        run: uv sync --frozen --extra dev

      - name: Test
        run: uv run pytest -q
